---
name: OCR fixture review and artifact steps
description: Extracted from 9007ae84e0de7b84d72f9833f6b12a2a731d5cbd
inputs:
  llm_url:
    description: LLM API endpoint URL (mapped to env OCR_LLM_URL).
    required: true
  llm_auth_token:
    description: LLM auth token (mapped to env OCR_LLM_TOKEN).
    required: true
  llm_model:
    description: Model name (mapped to env OCR_LLM_MODEL).
    required: true
  llm_use_anthropic:
    description: Selects the LLM protocol (mapped to env OCR_USE_ANTHROPIC). An explicitly
      supplied empty string, true, 1, or yes selects Anthropic case-insensitively;
      every other value selects the OpenAI-compatible protocol, preserving the CLI
      environment contract. Ignored when llm_protocol names the protocol explicitly.
    required: true
  llm_protocol:
    description: 'Explicit LLM protocol written to `llm.protocol`: anthropic, openai
      or openai-responses (case-insensitive). When set it wins over llm_use_anthropic,
      which is mirrored from it the way `ocr config set llm.protocol` mirrors the
      boolean. Leave empty to keep deriving the protocol from llm_use_anthropic; an
      OCR_LLM_PROTOCOL variable in the job or step environment is honoured the same
      way when this is empty.'
    required: false
  llm_auth_header:
    description: Custom auth header name (mapped to env OCR_LLM_AUTH_HEADER).
    required: false
  llm_extra_headers:
    description: Extra headers "K=V,K=V" (mapped to env OCR_LLM_EXTRA_HEADERS).
    required: false
  llm_extra_body:
    description: extra_body JSON for LLM requests. No env var exists for this, so
      it is written via `ocr config set llm.extra_body`. The default disables thinking
      mode for compatibility with various LLM providers; override it with provider-specific
      JSON when a model needs different behavior. An explicit reasoning_effort key
      here wins over the llm_reasoning_effort input.
    required: false
    default: '{"thinking": {"type": "disabled"}}'
  llm_reasoning_effort:
    description: 'Reasoning depth for the model (one of: minimal, low, medium, high,
      max; case-insensitive), merged into the request body as reasoning_effort via
      llm.extra_body — no CLI support beyond the published versions is needed. OpenAI-compatible
      protocols only (e.g. GLM-5.x, OpenAI reasoning models); the Anthropic API rejects
      unknown body fields, so the action fails fast when this is set on the Anthropic
      protocol — steer Anthropic thinking through an explicit llm_extra_body key instead.
      Empty (default) sends nothing. An explicit reasoning_effort key in llm_extra_body
      wins over this input.'
    required: false
    default: ''
  language:
    description: Review output language, written via `ocr config set language` (e.g.
      English, Chinese). No env var exists for this.
    required: false
    default: English
  llm_timeout:
    description: LLM request timeout in seconds (mapped to env OCR_LLM_TIMEOUT).
    required: false
    default: '300'
  review_task_timeout:
    description: Per-file/concurrent-task timeout in integer minutes, from 1 through
      120.
    required: false
    default: '15'
  ocr_version:
    description: npm version spec for @alibaba-group/open-code-review (v1.9.6 or newer
      required).
    required: false
    default: latest
  review_concurrency:
    description: Value passed to `ocr review --concurrency`.
    required: false
  background:
    description: Value passed to `ocr review --background`.
    required: false
  rule:
    description: Path to a custom rules JSON file passed to `ocr review --rule`.
    required: false
  effort:
    description: 'Review effort preset passed to `ocr review --effort`. One of: low,
      medium, high (case-insensitive). Empty keeps the CLI default (the configured
      value, or medium). Requires OpenCodeReview v1.10.0 or newer.'
    required: false
    default: ''
  max_tokens_budget:
    description: 'Total token cap passed to `ocr review --max-tokens-budget`. Base-10
      integer; empty or 0 means unlimited. Checked before every LLM round: a group
      already over the cap gets one final round to submit findings, no further groups
      are dispatched, over-budget and skipped files are reported as failed(budget).
      A budget-only partial review with usable coverage exits 0. Operational failures
      (such as timeouts or provider errors) and fully failed reviews (including budget-only
      failures) exit non-zero. The CLI emits available results. On a non-zero exit,
      the Action can upload the raw output as an artifact but skips posting PR comments.'
    required: false
    default: ''
  stream_progress:
    description: 'Stream live [ocr] review progress to the workflow log (human audience
      on stderr) instead of staying silent until the run finishes. One of: true, false
      (case-insensitive); empty falls back to false. false (default) keeps the silent
      agent-audience run with stderr captured to a log file. Requires OpenCodeReview
      v1.9.8 or newer when enabled.'
    required: false
    default: 'false'
  upload_artifacts:
    description: Upload raw JSON result and stderr as workflow artifacts. Must be
      the literal string 'true' or 'false' (quoted); the step gates on a string comparison,
      so an unquoted YAML boolean will not match.
    required: false
    default: 'true'
  sticky_summary:
    description: Summary dimension. true = update an existing summary comment in place
      (sticky) instead of posting a new one each run.
    required: false
    default: 'true'
  incremental:
    description: Incremental dimension. true = only append inline comments whose (path,
      line range) does not overlap an existing bot review comment. Among new inline
      candidates, more severe findings take precedence when ranges overlap; ties keep
      report order. History is never deleted.
    required: false
    default: 'false'
  incremental_overlap_threshold:
    description: 'IoU (intersection-over-union) threshold used by incremental mode
      to decide whether a new multi-line comment overlaps an existing one. Two single-line
      comments match when on the same line; single- vs multi-line never match. Value
      in (0, 1]. Read only when incremental is true: resolve_outdated decides overlap
      by any shared line, with no threshold, because a missed overlap there resolves
      a thread whose finding is still live.'
    required: false
    default: '0.6'
  resolve_outdated:
    description: 'Resolve the action''s own outdated inline review threads (threads
      GitHub has already marked outdated because their lines no longer exist in the
      diff). Threads a human replied to, threads already resolved, and threads whose
      lines a finding from the current run still covers are never touched. One of:
      ''false'' (default, does nothing and makes no API calls), ''report'' (log what
      would be resolved, change nothing — run this first), ''true'' (actually resolve).
      ''true'' requires the calling workflow to grant `contents: write` in its own
      `permissions:` block: GitHub gates the resolve mutation on repository write
      access, not on the pull-request scope, so `pull-requests: write` alone returns
      FORBIDDEN. Without it the action warns and continues. ''report'' issues no mutation,
      so it cannot tell you in advance whether ''true'' would be permitted. A thread
      is covered when a current finding shares ANY line with it; the incremental_overlap_threshold
      IoU test is not used here.'
    required: false
    default: 'false'
  review_comment_batch_size:
    description: Maximum number of inline comments packed into a single createReview
      call. Large reviews are split into sequential batches of at most this size so
      a single request never exceeds GitHub's practical limits (a prior run failed
      after posting 71 inline comments in one request). Integer >= 1; values below
      1 or non-numeric fall back to the default (50).
    required: false
    default: '50'
  route_severity_below:
    description: 'Optional severity threshold that routes findings at-or-below it
      from inline comments to the PR summary (fail-open: never drops a finding). One
      of: critical, high, medium, low. For example, ''low'' routes only low-severity
      findings, while ''medium'' routes medium AND low. An empty or unknown value
      disables severity routing (findings stay inline). Findings with an empty or
      unknown severity are never routed by this policy and keep their normal placement.'
    required: false
    default: ''
  route_categories:
    description: 'Optional comma-separated list of categories routed from inline comments
      to the PR summary (fail-open: never drops a finding). Categories are case-insensitive
      and drawn from: bug, security, performance, maintainability, test, style, documentation,
      other. For example, ''style,documentation'' routes those categories to the summary.
      Unknown category tokens are ignored. Findings with an empty or unknown category
      are never routed by this policy and keep their normal placement. Combine with
      route_severity_below to route on either condition.'
    required: false
    default: ''
  checkpoint_range:
    description: 'Cross-push checkpoints. true = a run that reviewed everything it
      selected records the head it covered in its sticky summary comment, and the
      next run reviews only <checkpoint>..<new head> instead of <merge-base>..<new
      head>. Fail-closed: if anything is in doubt — the summary is missing or was
      not posted by this token, the marker is unreadable, the base moved, the configuration
      changed, or git cannot prove the checkpoint is an ancestor of the new head —
      the full range is reviewed exactly as it is today. Requires sticky_summary;
      ignored without it.'
    required: false
    default: 'false'
  full_review:
    description: Force one full review even when checkpoint_range is enabled (reason
      'manual_full_review'). Use it to re-review a PR from the merge-base without
      turning checkpointing off; the run still records a new checkpoint.
    required: false
    default: 'false'
  base_ref:
    description: Override the base ref. Provide this (and head_sha) when invoking
      from a non-PR event such as issue_comment.
    required: false
  head_sha:
    description: Override the head commit SHA (use with base_ref for comment triggers).
    required: false
  pr_number:
    description: Override the pull request number the run fetches and posts to. Defaults
      to the number in the event payload (pull_request / pull_request_target / issue_comment),
      then to github.event.workflow_run.pull_requests[0].number. Provide it for a
      trigger that carries no pull request of its own, or when a workflow_run payload
      lists more than one; the action fails before any review work when no number
      resolves.
    required: false
    default: ''
  node_version:
    description: Node.js version for actions/setup-node.
    required: false
    default: '24'
runs:
  using: composite
  steps:
  - name: Run OpenCodeReview
    env:
      OCR_NO_UPDATE: '1'
      OCR_LLM_URL: "${{ inputs.llm_url }}"
      OCR_LLM_TOKEN: "${{ inputs.llm_auth_token }}"
      OCR_LLM_MODEL: "${{ inputs.llm_model }}"
      OCR_USE_ANTHROPIC: "${{ inputs.llm_use_anthropic }}"
      OCR_LLM_AUTH_HEADER: "${{ inputs.llm_auth_header }}"
      OCR_LLM_EXTRA_HEADERS: "${{ inputs.llm_extra_headers }}"
      OCR_LLM_TIMEOUT: "${{ inputs.llm_timeout }}"
      OCR_REVIEW_CONCURRENCY: "${{ inputs.review_concurrency }}"
      OCR_BACKGROUND: "${{ inputs.background }}"
      OCR_RULE: "${{ inputs.rule }}"
      RANGE_FROM: "${{ steps.range.outputs.range_from }}"
    shell: bash
    run: |
      export OCR_LLM_TIMEOUT="${OCR_LLM_TIMEOUT:-300}"
      if [ -z "${REVIEW_TASK_TIMEOUT:-}" ]; then
        echo "::error::Validated review_task_timeout is missing; the Validate inputs step must complete first"
        exit 1
      fi
      ARGS=(--from "${RANGE_FROM:-$MERGE_BASE}" --to "${HEAD_SHA}")
      # stream_progress 'false' (default): agent audience, stderr captured to
      # the log file without a live tee. Opt-in 'true': no --audience agent,
      # so human-audience routing sends [ocr] progress lines to stderr; a
      # FIFO feeds a background tee so progress streams live into the
      # workflow log while still landing in the file for artifacts and the
      # posting step. The tee is a real background job rather than process
      # substitution so `wait` below guarantees the file is fully flushed
      # before anything reads it. Neither mode disturbs $?.
      [ "${STREAM_PROGRESS:-false}" = "true" ] || ARGS+=(--audience agent)
      ARGS+=(--format json --timeout "$REVIEW_TASK_TIMEOUT")
      [ -n "$OCR_REVIEW_CONCURRENCY" ] && ARGS+=(--concurrency "$OCR_REVIEW_CONCURRENCY")
      [ -n "$OCR_BACKGROUND" ] && ARGS+=(--background "$OCR_BACKGROUND")
      [ -n "$OCR_RULE" ] && ARGS+=(--rule "$OCR_RULE")
      [ -n "${EFFORT:-}" ] && ARGS+=(--effort "$EFFORT")
      [ -n "${MAX_TOKENS_BUDGET:-}" ] && ARGS+=(--max-tokens-budget "$MAX_TOKENS_BUDGET")
      set +e
      if [ "${STREAM_PROGRESS:-false}" = "true" ]; then
        OCR_STDERR_FIFO="$(mktemp -u)"
        mkfifo "$OCR_STDERR_FIFO" || exit 1
        tee /tmp/ocr-stderr.log < "$OCR_STDERR_FIFO" >&2 &
        TEE_PID=$!
        ocr review "${ARGS[@]}" > /tmp/ocr-result.json 2> "$OCR_STDERR_FIFO"
        OCR_EXIT_CODE=$?
        wait "$TEE_PID"
        rm -f "$OCR_STDERR_FIFO"
      else
        ocr review "${ARGS[@]}" > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log
        OCR_EXIT_CODE=$?
      fi
      set -e
      echo "OCR_EXIT_CODE=$OCR_EXIT_CODE" >> "$GITHUB_ENV"
      echo "=== OCR result ==="
      cat /tmp/ocr-result.json
      echo "=== OCR stderr ==="
      cat /tmp/ocr-stderr.log
  - name: Upload review artifacts
    if: "${{ always() && inputs.upload_artifacts == 'true' }}"
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: ocr-review-result-${{ github.run_id }}-${{ github.run_attempt }}
      path: |
        /tmp/ocr-result.json
        /tmp/ocr-stderr.log
      if-no-files-found: warn
  - name: Fail job on OCR error
    if: env.OCR_EXIT_CODE != '0'
    shell: bash
    run: |
      echo "ocr review exited with code ${OCR_EXIT_CODE}; see uploaded artifacts for details."
      exit "${OCR_EXIT_CODE}"
